<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · TaskFlow</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card card-auth">
      <h1>Create account</h1>
      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input class="form-control" id="name" name="name" required>
          <div class="field-error" data-error="name"></div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" required>
          <div class="field-error" data-error="email"></div>
        </div>
        <div class="form-group">
          <label for="password">Password (min 8 characters)</label>
          <input class="form-control" id="password" name="password" type="password" required>
          <div class="field-error" data-error="password"></div>
        </div>
        <p class="field-error" id="form-error"></p>
        <button class="btn btn-accent" type="submit" style="width:100%">Create account</button>
      </form>
      <p>Already registered? <a href="login.html">Log in</a></p>
    </div>
  </div>
  <script type="module" src="../js/pages/register.js"></script>
</body>
</html>
