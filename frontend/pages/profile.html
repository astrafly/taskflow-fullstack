<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · TaskFlow</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="container" style="max-width:600px">
    <h1>Profile</h1>
    <div class="card">
      <h2>Your details</h2>
      <img class="avatar" id="avatar-preview" src="" alt="Your avatar" style="margin-bottom:1rem">
      <form id="profile-form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input class="form-control" id="name" name="name" required>
          <div class="field-error" data-error="name"></div>
        </div>
        <div class="form-group">
          <label for="avatar">Profile picture (JPG, PNG or GIF, max 2 MB)</label>
          <input class="form-control" id="avatar" type="file" accept="image/png,image/jpeg,image/gif">
          <div class="field-error" data-error="avatar"></div>
        </div>
        <p class="field-error" id="form-error"></p>
        <button class="btn btn-accent" type="submit">Save profile</button>
      </form>
    </div>
    <div class="card">
      <h2>Change password</h2>
      <form id="password-form" novalidate>
        <div class="form-group">
          <label for="currentPassword">Current password</label>
          <input class="form-control" id="currentPassword" type="password" required>
          <div class="field-error" data-error="currentPassword"></div>
        </div>
        <div class="form-group">
          <label for="newPassword">New password (min 8 characters)</label>
          <input class="form-control" id="newPassword" type="password" required>
          <div class="field-error" data-error="newPassword"></div>
        </div>
        <button class="btn" type="submit">Change password</button>
      </form>
    </div>
  </main>
  <div class="toast-container"></div>
  <script type="module" src="../js/pages/profile.js"></script>
</body>
</html>
