<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · TaskFlow</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card card-auth">
      <h1>Log in</h1>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
          <div class="field-error" data-error="email"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          <label><input type="checkbox" id="show-pass"> Show password</label>
          <div class="field-error" data-error="password"></div>
        </div>
        <p class="field-error" id="form-error"></p>
        <button class="btn" type="submit" style="width:100%">Log in</button>
      </form>
      <p>No account? <a href="register.html">Create one</a></p>
      <p class="task-meta">Demo admin: admin@demo.com / Admin@123</p>
    </div>
  </div>
  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
